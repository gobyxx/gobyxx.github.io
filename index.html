<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Job search analytics</title>
<style>
  /* Public analytics for the job tracker. Reads analytics.json only (built by agent_tools.py analytics).
     Outcome colors are the first three slots of the validated categorical palette (dataviz reference),
     on its reference chart surfaces. */
  :root {
    --bg: #f3f3f1; --surface: #fcfcfb; --surface-2: #f0efec; --border: #e2e1dd; --grid: #ebeae6;
    --text: #0b0b0b; --text-2: #52514e; --muted: #77766f;
    --accent: #2a78d6;
    --s-wait: #2a78d6; --s-rej: #eb6834; --s-pos: #1baf7a; --s-prep: #a3a29b;
    --shadow: 0 1px 2px rgba(20, 20, 18, .05);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #111110; --surface: #1a1a19; --surface-2: #232321; --border: #2e2e2b; --grid: #2a2a27;
      --text: #f0efec; --text-2: #c3c2b7; --muted: #8f8e86;
      --accent: #3987e5;
      --s-wait: #3987e5; --s-rej: #d95926; --s-pos: #199e70; --s-prep: #6b6a63;
      --shadow: none;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #111110; --surface: #1a1a19; --surface-2: #232321; --border: #2e2e2b; --grid: #2a2a27;
    --text: #f0efec; --text-2: #c3c2b7; --muted: #8f8e86;
    --accent: #3987e5;
    --s-wait: #3987e5; --s-rej: #d95926; --s-pos: #199e70; --s-prep: #6b6a63;
    --shadow: none;
    color-scheme: dark;
  }
  *, *::before, *::after { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI Variable Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--accent); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .wrap {
    max-width: 1120px; margin: 0 auto; display: grid; gap: 20px;
    padding-block: 28px 56px;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 6px 20px; }
  h1 { margin: 0; font-size: 24px; letter-spacing: -.015em; }
  h2 { margin: 0; font-size: 15px; }
  .sub { color: var(--text-2); font-size: 13px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow); padding: 18px 20px; min-width: 0; }
  .card-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px 16px; margin-bottom: 12px; }

  .kpis { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px; }
  .kpi { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; display: grid; gap: 2px; }
  .kpi .n { font-size: 26px; font-weight: 650; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
  .kpi .l { color: var(--text-2); font-size: 12.5px; }
  .kpi .d { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }

  .grid2 { display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr); gap: 20px; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12.5px; color: var(--text-2); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .sw { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
  .chart { position: relative; }
  .chart svg { display: block; width: 100%; height: auto; overflow: visible; }
  .chart text { fill: var(--muted); font-size: 11.5px; font-variant-numeric: tabular-nums; }
  .chart .val { fill: var(--text-2); }
  .chart .gl { stroke: var(--grid); stroke-width: 1; }
  .chart .base { stroke: var(--border); stroke-width: 1; }
  .chart .hit { fill: transparent; cursor: default; }
  .chart .hit:hover { fill: var(--surface-2); fill-opacity: .6; }
  .tip {
    position: absolute; pointer-events: none; z-index: 2; min-width: 150px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 8px; box-shadow: 0 6px 20px -8px rgba(0,0,0,.3);
    padding: 8px 10px; font-size: 12.5px; color: var(--text);
  }
  .tip b { display: block; margin-bottom: 4px; }
  .tip .r { display: flex; justify-content: space-between; gap: 14px; color: var(--text-2); }
  .tip .r span:last-child { color: var(--text); font-variant-numeric: tabular-nums; }
  .empty { color: var(--muted); padding: 24px 0; text-align: center; }

  .scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; font-size: 11.5px; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); font-weight: 600; padding: 8px 10px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  td { padding: 8px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  td.date { white-space: nowrap; font-variant-numeric: tabular-nums; color: var(--text-2); }
  tbody tr:hover td { background: var(--surface-2); }
  .st { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  .st i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
  .filters { display: flex; flex-wrap: wrap; gap: 8px; }
  .filters input, .filters select {
    font: inherit; font-size: 13px; color: var(--text); background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px; height: 32px; padding: 0 10px;
  }
  .filters input { width: 220px; max-width: 100%; }
  .count { color: var(--muted); font-size: 12.5px; }

  @media (max-width: 900px) {
    .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .grid2 { grid-template-columns: minmax(0, 1fr); }
  }
  @media (max-width: 480px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Job search analytics</h1>
    <span class="sub" id="updated"></span>
  </header>

  <section class="kpis" id="kpis" aria-label="Totals"></section>

  <div class="grid2">
    <section class="card" aria-labelledby="weekly-h">
      <div class="card-head">
        <h2 id="weekly-h">Applications sent per week</h2>
        <div class="legend" id="legend"></div>
      </div>
      <div class="chart" id="weekly"></div>
    </section>
    <section class="card" aria-labelledby="site-h">
      <div class="card-head"><h2 id="site-h">Sent by site</h2></div>
      <div class="chart" id="bysite"></div>
    </section>
  </div>

  <section class="card" aria-labelledby="runs-h">
    <div class="card-head"><h2 id="runs-h">Daily runs</h2><span class="count">Jobs the agent found, picked, prepared and sent each day</span></div>
    <div class="scroll" id="runs"></div>
  </section>

  <section class="card" aria-labelledby="apps-h">
    <div class="card-head">
      <h2 id="apps-h">All applications</h2>
      <div class="filters">
        <input type="search" id="q" placeholder="Search company, title, place" aria-label="Search applications">
        <select id="f" aria-label="Filter by outcome"></select>
      </div>
    </div>
    <div class="scroll" id="apps"></div>
    <p class="count" id="appsCount"></p>
  </section>
</div>

<script>
(() => {
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  // Outcome buckets. The three "sent" ones are charted, in this fixed order (palette slots 1-3).
  const BUCKETS = {
    wait: { label: 'Waiting for a reply', color: 'var(--s-wait)', sent: true },
    rej:  { label: 'Rejected',            color: 'var(--s-rej)',  sent: true },
    pos:  { label: 'Positive reply',      color: 'var(--s-pos)',  sent: true },
    prep: { label: 'Being prepared',      color: 'var(--s-prep)', sent: false },
    off:  { label: 'Not sent',            color: 'var(--s-prep)', sent: false },
  };
  const SENT = ['wait', 'rej', 'pos'];
  const bucketOf = (status) => {
    const s = String(status || '').toLowerCase();
    if (s === 'rejected') return 'rej';
    if (['accepted', 'interview', 'offer', 'positive'].includes(s)) return 'pos';
    if (['draft', 'ready for review', 'approved', 'needs you'].includes(s)) return 'prep';
    if (['skipped', 'submit failed', ''].includes(s)) return 'off';
    return 'wait'; // Applied and any other status set after sending
  };
  const day = (s) => (s ? new Date(`${s}T12:00:00`) : null);
  const fmtDay = (d, opts = { day: 'numeric', month: 'short' }) => d.toLocaleDateString('en-GB', opts);
  const monday = (d) => { const x = new Date(d); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); x.setHours(12, 0, 0, 0); return x; };

  let apps = [];

  async function load() {
    let data;
    try {
      const res = await fetch('analytics.json', { cache: 'no-store' });
      if (!res.ok) throw new Error(res.status);
      data = await res.json();
    } catch {
      document.querySelector('.wrap').insertAdjacentHTML('beforeend', '<p class="card empty">analytics.json could not be loaded. Run <code>python agent_tools.py analytics</code>.</p>');
      return;
    }
    apps = (data.applications || []).map((a) => ({ ...a, bucket: bucketOf(a.status), when: a.submitted || a.date }));
    if (data.generated) $('#updated').textContent = `Updated ${new Date(data.generated).toLocaleString('en-GB', { dateStyle: 'medium', timeStyle: 'short' })}`;
    kpis();
    legend();
    weekly();
    bySite();
    runs(data.runs || []);
    filters();
    table();
    let t;
    window.addEventListener('resize', () => { clearTimeout(t); t = setTimeout(() => { weekly(); bySite(); }, 120); });
  }

  function kpis() {
    const n = (b) => apps.filter((a) => a.bucket === b).length;
    const sent = apps.filter((a) => BUCKETS[a.bucket].sent).length;
    const replies = n('rej') + n('pos');
    const tiles = [
      [sent, 'Applications sent', null],
      [n('wait'), 'Waiting for a reply', 'var(--s-wait)'],
      [n('rej'), 'Rejected', 'var(--s-rej)'],
      [n('pos'), 'Positive replies', 'var(--s-pos)'],
      [sent ? `${Math.round((replies / sent) * 100)}%` : '–', 'Response rate', null],
      [n('prep'), 'Being prepared', null],
    ];
    $('#kpis').innerHTML = tiles.map(([v, l, c]) => `<div class="kpi"><span class="n">${esc(v)}</span><span class="l">${c ? `<i class="d" style="background:${c}"></i>` : ''}${esc(l)}</span></div>`).join('');
  }

  function legend() {
    $('#legend').innerHTML = SENT.map((b) => `<span><i class="sw" style="background:${BUCKETS[b].color}"></i>${BUCKETS[b].label}</span>`).join('');
  }

  const niceStep = (max) => { for (const s of [1, 2, 5, 10, 20, 25, 50, 100]) if (max / s <= 5) return s; return Math.ceil(max / 5); };

  // Rounded top corners only: the data end is the top, the baseline end stays square.
  const barPath = (x, y, w, h, r) => {
    r = Math.min(r, w / 2, h);
    return `M${x},${y + h}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h}Z`;
  };

  function weekly() {
    const el = $('#weekly');
    const sent = apps.filter((a) => BUCKETS[a.bucket].sent && a.when);
    if (!sent.length) { el.innerHTML = '<p class="empty">No applications sent yet.</p>'; return; }
    const weeks = new Map();
    const first = monday(day(sent.reduce((m, a) => (a.when < m ? a.when : m), sent[0].when)));
    const last = monday(new Date());
    for (let d = new Date(first); d <= last; d.setDate(d.getDate() + 7)) weeks.set(d.toDateString(), { start: new Date(d), wait: 0, rej: 0, pos: 0 });
    sent.forEach((a) => { const w = weeks.get(monday(day(a.when)).toDateString()); if (w) w[a.bucket] += 1; });
    const list = [...weeks.values()].slice(-26);

    const W = Math.max(280, el.clientWidth), H = 240, m = { t: 12, r: 8, b: 26, l: 30 };
    const iw = W - m.l - m.r, ih = H - m.t - m.b;
    const max = Math.max(1, ...list.map((w) => w.wait + w.rej + w.pos));
    const step = niceStep(max), top = Math.ceil(max / step) * step;
    const y = (v) => m.t + ih - (v / top) * ih;
    const band = iw / list.length, bw = Math.max(6, Math.min(36, band * 0.62));
    const every = Math.ceil(list.length / Math.max(1, Math.floor(iw / 64)));

    let s = '';
    for (let v = 0; v <= top; v += step) s += `<line class="${v ? 'gl' : 'base'}" x1="${m.l}" x2="${W - m.r}" y1="${y(v)}" y2="${y(v)}"/><text x="${m.l - 8}" y="${y(v) + 4}" text-anchor="end">${v}</text>`;
    list.forEach((w, i) => {
      const cx = m.l + band * i + band / 2, x = cx - bw / 2;
      let acc = 0;
      const parts = SENT.filter((b) => w[b] > 0);
      parts.forEach((b, k) => {
        const y0 = y(acc), y1 = y(acc + w[b]);
        const gap = k < parts.length - 1 ? 2 : 0; // 2px surface gap between stacked segments
        const h = Math.max(1, y0 - y1 - gap);
        s += k === parts.length - 1
          ? `<path d="${barPath(x, y1, bw, h, 4)}" fill="${BUCKETS[b].color}"/>`
          : `<rect x="${x}" y="${y1 + gap}" width="${bw}" height="${h}" fill="${BUCKETS[b].color}"/>`;
        acc += w[b];
      });
      if (i % every === 0) s += `<text x="${cx}" y="${H - 8}" text-anchor="middle">${esc(fmtDay(w.start))}</text>`;
      s += `<rect class="hit" data-i="${i}" x="${m.l + band * i}" y="${m.t}" width="${band}" height="${ih}"/>`;
    });
    el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Applications sent per week, by outcome">${s}</svg><div class="tip" hidden></div>`;
    tooltips(el, (i) => {
      const w = list[i], total = w.wait + w.rej + w.pos;
      return `<b>Week of ${esc(fmtDay(w.start, { day: 'numeric', month: 'short', year: 'numeric' }))}</b>${SENT.map((b) => `<div class="r"><span><i class="sw" style="background:${BUCKETS[b].color};width:8px;height:8px"></i> ${BUCKETS[b].label}</span><span>${w[b]}</span></div>`).join('')}<div class="r"><span>Total</span><span>${total}</span></div>`;
    });
  }

  function bySite() {
    const el = $('#bysite');
    const counts = new Map();
    apps.filter((a) => BUCKETS[a.bucket].sent).forEach((a) => counts.set(a.site, (counts.get(a.site) || 0) + 1));
    const list = [...counts.entries()].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));
    if (!list.length) { el.innerHTML = '<p class="empty">No applications sent yet.</p>'; return; }
    const W = Math.max(240, el.clientWidth), row = 30, H = list.length * row + 4;
    const labelW = Math.min(130, W * 0.38), iw = W - labelW - 36;
    const max = Math.max(...list.map((r) => r[1]));
    let s = '';
    list.forEach(([site, n], i) => {
      const yy = i * row + 6, w = Math.max(2, (n / max) * iw);
      s += `<text x="${labelW - 10}" y="${yy + 13}" text-anchor="end">${esc(site)}</text>`;
      s += `<path d="M${labelW},${yy} H${labelW + w - 4} Q${labelW + w},${yy} ${labelW + w},${yy + 4} V${yy + 14} Q${labelW + w},${yy + 18} ${labelW + w - 4},${yy + 18} H${labelW} Z" fill="var(--s-wait)"/>`;
      s += `<text class="val" x="${labelW + w + 6}" y="${yy + 13}">${n}</text>`;
      s += `<rect class="hit" data-i="${i}" x="0" y="${yy - 5}" width="${W}" height="${row}"/>`;
    });
    el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Applications sent by site">${s}</svg><div class="tip" hidden></div>`;
    tooltips(el, (i) => {
      const [site, n] = list[i];
      const mine = apps.filter((a) => a.site === site && BUCKETS[a.bucket].sent);
      return `<b>${esc(site)}</b>${SENT.map((b) => `<div class="r"><span>${BUCKETS[b].label}</span><span>${mine.filter((a) => a.bucket === b).length}</span></div>`).join('')}<div class="r"><span>Total</span><span>${n}</span></div>`;
    });
  }

  function tooltips(el, html) {
    const tip = el.querySelector('.tip');
    el.querySelectorAll('.hit').forEach((h) => {
      h.addEventListener('mousemove', (e) => {
        tip.innerHTML = html(+h.dataset.i);
        tip.hidden = false;
        const box = el.getBoundingClientRect();
        let x = e.clientX - box.left + 14, yy = e.clientY - box.top + 10;
        if (x + tip.offsetWidth > box.width) x = e.clientX - box.left - tip.offsetWidth - 14;
        tip.style.left = `${Math.max(0, x)}px`;
        tip.style.top = `${yy}px`;
      });
      h.addEventListener('mouseleave', () => { tip.hidden = true; });
    });
  }

  function runs(list) {
    const el = $('#runs');
    if (!list.length) { el.innerHTML = '<p class="empty">No agent runs yet. Each daily run shows up here.</p>'; return; }
    const rows = [...list].sort((a, b) => String(b.date).localeCompare(String(a.date))).map((r) => `<tr>
      <td class="date">${esc(r.date ? fmtDay(day(r.date), { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' }) : '')}</td>
      <td>${esc((r.sites || []).join(', '))}</td>
      <td class="num">${r.found}</td><td class="num">${r.picked}</td><td class="num">${r.prepared}</td><td class="num">${r.sent}</td><td class="num">${r.skipped}</td></tr>`).join('');
    el.innerHTML = `<table><thead><tr><th>Date</th><th>Sites</th><th class="num">Found</th><th class="num">Picked</th><th class="num">Prepared</th><th class="num">Sent</th><th class="num">Skipped</th></tr></thead><tbody>${rows}</tbody></table>`;
  }

  function filters() {
    const opts = [['all', 'All outcomes'], ...Object.entries(BUCKETS).map(([k, b]) => [k, b.label])];
    $('#f').innerHTML = opts.map(([k, l]) => `<option value="${k}">${esc(l)}</option>`).join('');
    $('#q').addEventListener('input', table);
    $('#f').addEventListener('change', table);
  }

  function table() {
    const q = $('#q').value.trim().toLowerCase(), f = $('#f').value;
    const rows = apps
      .filter((a) => (f === 'all' || a.bucket === f) && (!q || `${a.company} ${a.title} ${a.location} ${a.site}`.toLowerCase().includes(q)))
      .sort((a, b) => String(b.when).localeCompare(String(a.when)));
    $('#appsCount').textContent = `${rows.length} of ${apps.length} applications`;
    if (!rows.length) { $('#apps').innerHTML = '<p class="empty">Nothing matches.</p>'; return; }
    $('#apps').innerHTML = `<table><thead><tr><th>Date</th><th>Company</th><th>Job title</th><th>Location</th><th>Site</th><th>Status</th><th>Posting</th></tr></thead><tbody>${rows.map((a) => `<tr>
      <td class="date">${esc(a.when ? fmtDay(day(a.when), { day: 'numeric', month: 'short', year: 'numeric' }) : '')}</td>
      <td>${esc(a.company)}</td><td>${esc(a.title)}</td><td>${esc(a.location)}</td><td>${esc(a.site)}</td>
      <td><span class="st"><i style="background:${BUCKETS[a.bucket].color}"></i>${esc(a.status || BUCKETS[a.bucket].label)}</span></td>
      <td>${a.link ? `<a href="${esc(a.link)}" target="_blank" rel="noopener noreferrer">Open ↗</a>` : ''}</td></tr>`).join('')}</tbody></table>`;
  }

  load();
})();
</script>
</body>
</html>
